name: NEONLOOM Windows build
on:
  push:
    branches: [claude/etsy-business-os-prd-5sioge]
    paths: ["EtsyBusinessOS/**", ".github/workflows/neonloom-windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EtsyBusinessOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebview==6.2.1 pyinstaller==6.22.3 pytest httpx2
      - name: Tests
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller tools/neonloom.spec --noconfirm
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          Copy-Item VERSION dist/NEONLOOM/
          Copy-Item README.md dist/NEONLOOM/ -ErrorAction SilentlyContinue
          Copy-Item app/web/static/sfx/CREDITS.txt dist/NEONLOOM/SFX-CREDITS.txt
          Compress-Archive -Path dist/NEONLOOM -DestinationPath "dist/NEONLOOM_v$v`_windows.zip"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Smoke test (server starts inside the exe bundle)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/NEONLOOM/NEONLOOM.exe -ArgumentList "--server-only" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { $r = Invoke-WebRequest http://127.0.0.1:8765/api/world -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {} }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-ChildItem dist/NEONLOOM/logs -ErrorAction SilentlyContinue; Get-Content dist/NEONLOOM/logs/*.log -ErrorAction SilentlyContinue; Write-Error "server did not start from the exe"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: NEONLOOM_v${{ env.VERSION }}_windows
          path: EtsyBusinessOS/dist/NEONLOOM_v${{ env.VERSION }}_windows.zip
          retention-days: 30
